<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Performance Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <h1>Student Performance Dashboard</h1>

        <!-- Required Controls -->
        <div class="controls">
            <input type="text" id="searchInput" placeholder="Enter student name">
            
            <select id="blockFilter">
                <option value="All">All</option>
                <option value="31-ITE-01">31-ITE-01</option>
                <option value="31-ITE-02">31-ITE-02</option>
                <option value="31-ITE-03">31-ITE-03</option>
            </select>

            <select id="statusFilter">
                <option value="All">All</option>
                <option value="Excellent">Excellent</option>
                <option value="Passed">Passed</option>
                <option value="Needs Improvement">Needs Improvement</option>
                <option value="Failed">Failed</option>
            </select>

            <button id="applyBtn">Apply Filters</button>
            <button id="resetBtn">Reset</button>
        </div>

        <!-- Required Summary Elements -->
        <div class="summary-board">
            <div>Displayed Students: <span id="displayedCount">0</span></div>
            <div>Class Average: <span id="classAverage">0</span></div>
            <div>Passing Count: <span id="passingCount">0</span></div>
            <div>Top Student: <span id="topStudent">None</span></div>
        </div>

        <!-- Required Message Area -->
        <div id="messageArea"></div>

        <!-- Required Student List Container -->
        <div id="studentList"></div>
    </div>

    <!-- Required Script Hook -->
    <script type="module" src="js/main.js"></script>
</body>
</html>
